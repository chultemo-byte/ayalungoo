<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amita shows — Ayalungoo</title>
  <style>
    :root { --gold:#c9a36a; --foam:#d7ece8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, serif; color:#e8f2f0; background:linear-gradient(180deg,#07161c,#0b2a33); }
    .wrap { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
    a { color:var(--gold); }
    h1 { font-weight:500; font-size:1.8rem; }
    .lede, .caps, .safe { color:var(--foam); line-height:1.5; }
    .pool { background:#052028; border:1px solid rgba(201,163,106,.35); border-radius:12px; margin:16px 0; padding:8px; }
    svg { width:100%; height:auto; display:block; }
    .grid { display:flex; flex-wrap:wrap; gap:6px; }
    button { background:rgba(7,22,28,.6); color:#f4efe4; border:1px solid rgba(201,163,106,.3); padding:8px 10px; cursor:pointer; font:inherit; }
    button.on { border-color:var(--gold); color:var(--gold); }
    .safe { color:#9bb8b4; font-size:.88rem; }
    .wave { animation: wave 2.4s ease-in-out infinite; }
    .kick { animation: kick 1.1s ease-in-out infinite; }
    .kick2 { animation: kick 1.1s ease-in-out infinite reverse; }
    @keyframes kick { 50% { transform: rotate(18deg); } }
    @keyframes wave { 50% { transform: translateY(4px); } }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/">← Ayalungoo</a>
    · <a href="/swimming/">Amita Swimming</a>
    <h1>Amita shows</h1>
    <p class="lede">Watch my body. First I float. Then I dance. Then I swim. A grown-up stays close enough to touch you.</p>
    <div class="pool">
      <svg viewBox="0 0 448 280" aria-label="Amita demonstrating">
        <rect width="448" height="280" fill="#08323c"/>
        <ellipse class="wave" cx="224" cy="210" rx="170" ry="28" fill="none" stroke="#c9a36a" stroke-opacity=".35"/>
        <g id="fig">
          <circle cx="224" cy="78" r="16" fill="#e8f2f0"/>
          <rect x="206" y="96" width="36" height="72" rx="10" fill="#c9a36a"/>
          <line id="armL" x1="206" y1="110" x2="150" y2="118" stroke="#c9a36a" stroke-width="8" stroke-linecap="round"/>
          <line id="armR" x1="242" y1="110" x2="298" y2="118" stroke="#c9a36a" stroke-width="8" stroke-linecap="round"/>
          <line class="kick" id="legL" x1="214" y1="166" x2="188" y2="230" stroke="#c9a36a" stroke-width="8" stroke-linecap="round"/>
          <line class="kick2" id="legR" x1="234" y1="166" x2="260" y2="230" stroke="#c9a36a" stroke-width="8" stroke-linecap="round"/>
        </g>
        <text x="224" y="268" text-anchor="middle" fill="#c9a36a" font-size="13">Amita · boundless</text>
      </svg>
    </div>
    <p class="caps" id="cap">Starfish. Ears in. Eyes to the sky. Soft belly.</p>
    <div class="grid" id="grid"></div>
    <p class="safe">Land class. In water, a grown-up watches you. Never hold-until. Butterfly waits.</p>
  </div>
  <script>
    const MOVES=[
      {id:'starfish',name:'Starfish',cap:'Starfish. Ears in. Eyes to the sky. Soft belly. You do not kick to stay up.',rot:90,arms:[-20,20],legs:[-28,28],kick:false},
      {id:'jellyfish',name:'Jellyfish',cap:'Jellyfish. Soft curl. Face in the quiet water. Long bubbles.',rot:80,arms:[40,-40],legs:[20,-20],kick:false},
      {id:'ears',name:'Ears in',cap:'Head is the steering wheel. Ears in, hips rise.',rot:0,arms:[10,-10],legs:[6,-6],kick:false},
      {id:'bubbles',name:'Bubbles',cap:'Hum into the water. Bubbles out. Then sip air. Never hold until.',rot:20,arms:[8,-8],legs:[4,-4],kick:false},
      {id:'bob',name:'Bob',cap:'Mouth in. Bubbles. Stand. Air in. Again.',rot:0,arms:[30,-30],legs:[12,-12],kick:false},
      {id:'glide',name:'Arrow glide',cap:'Push from the wall. Arms like an arrow. Then one kick.',rot:90,arms:[0,0],legs:[2,-2],kick:false},
      {id:'flutter',name:'Flutter kick',cap:'Small kicks from the hips. Toes loose. Hold the wall first.',rot:90,arms:[0,0],legs:[-8,8],kick:true},
      {id:'frog',name:'Frog kick',cap:'Heels in. Press out and back together. Like a frog.',rot:90,arms:[16,-16],legs:[-24,24],kick:true},
      {id:'easyback',name:'Easy backstroke',cap:'On your back. Arms like an airplane. Then rest. Gentle frog kick.',rot:90,arms:[-35,35],legs:[-16,16],kick:true},
      {id:'crawl',name:'Front crawl',cap:'One arm, then the other. Face turns for a sip. After the float is quiet.',rot:90,arms:[-50,10],legs:[-10,10],kick:true},
      {id:'backcrawl',name:'Back crawl',cap:'On your back. Arms windmill slow. Look at the sky.',rot:90,arms:[-40,50],legs:[-10,10],kick:true},
      {id:'breast',name:'Breaststroke',cap:'Arms draw a heart. Frog kick. Glide. Do not rush the glide.',rot:90,arms:[-30,30],legs:[-22,22],kick:true},
      {id:'side',name:'Side swim',cap:'On your side. Legs like scissors. A quiet way home.',rot:90,arms:[-5,40],legs:[-20,8],kick:true},
      {id:'tread',name:'Tread water',cap:'Head up. Soft hands. Soft kicks. Stay near the wall.',rot:0,arms:[-25,25],legs:[-12,12],kick:true}
    ];
    const fig=document.getElementById('fig'),cap=document.getElementById('cap'),grid=document.getElementById('grid');
    function show(m){
      document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===m.id));
      cap.textContent=m.cap;
      fig.style.transform='rotate('+m.rot+'deg)';
      document.getElementById('armL').setAttribute('transform','rotate('+m.arms[0]+' 206 110)');
      document.getElementById('armR').setAttribute('transform','rotate('+m.arms[1]+' 242 110)');
      document.getElementById('legL').setAttribute('transform','rotate('+m.legs[0]+' 214 166)');
      document.getElementById('legR').setAttribute('transform','rotate('+m.legs[1]+' 234 166)');
      document.getElementById('legL').classList.toggle('kick',m.kick);
      document.getElementById('legR').classList.toggle('kick2',m.kick);
    }
    MOVES.forEach(m=>{const b=document.createElement('button');b.textContent=m.name;b.dataset.id=m.id;b.onclick=()=>show(m);grid.appendChild(b);});
    show(MOVES[0]);
  </script>
</body>
</html>
